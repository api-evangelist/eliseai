aid: eliseai
name: EliseAI
description: >-
  EliseAI is an agentic AI platform that automates communications and operations
  for the housing and healthcare industries. For property management it offers
  LeasingAI, ResidentAI, EliseCRM, VoiceAI, AI-guided tours, and automation for
  maintenance, renewals, move-in, delinquency, lease audits and fee transparency
  across SMS, email, chat and voice channels. For healthcare, its HealthAI
  automates patient scheduling, intake and communication with HIPAA and SOC 2
  Type II compliance. Elise integrates with leading PMS, CRM, EHR and RCM systems.
  API and integration access is provisioned through the EliseAI developer portal;
  the company does not publish a self-serve public OpenAPI. This profile was
  surfaced as a venture portfolio company and enriched by the API Evangelist
  pipeline.
